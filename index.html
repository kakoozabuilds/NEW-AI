<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel's AI Hub</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-glow: #38bdf8;
            --accent-glow-hover: #7dd3fc;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-dark);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }

        /* Logo Area */
        .branding-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }

        .logo-box {
            position: relative;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #0284c7, #0f172a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent-glow);
            box-shadow: 0 0 10px var(--border-glow);
            font-weight: 900;
            font-size: 1.5rem;
            color: white;
            letter-spacing: -1px;
        }

        .logo-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--accent-glow);
            border-radius: 12px;
            animation: pulse 2s infinite;
            opacity: 0.5;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .title-text h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #fff, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Chat Output Window */
        .chat-output {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: rgba(15, 23, 42, 0.3);
        }

        .msg-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .msg-user {
            background-color: var(--border-glow);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-ai {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .search-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--accent-glow);
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Input Controls Area */
        .input-bar {
            padding: 20px;
            background-color: var(--card-dark);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 12px;
        }

        .input-bar input {
            flex-grow: 1;
            background-color: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-bar input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
        }

        .input-bar button {
            background-color: var(--accent-glow);
            color: var(--bg-dark);
            border: none;
            padding: 0 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-bar button:hover {
            background-color: var(--accent-glow-hover);
        }

        .input-bar button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BRANDING HEADER MATRIX -->
        <header class="branding-header">
            <div class="logo-box">
                SΩ
                <div class="logo-pulse"></div>
            </div>
            <div class="title-text">
                <h1>SAMUEL's AI</h1>
                <p>Zero-Key Multi-Agent Web Search Network Engine</p>
            </div>
        </header>

        <!-- OUTPUT MAIN CORE -->
        <div class="chat-output" id="chatWindow">
            <div class="msg-bubble msg-ai">
                Hello! I am <strong>Samuel's AI</strong>. Ask me anything—I will scan the web in real time and summarize the answers for you without using an API key.
            </div>
        </div>

        <!-- INPUT FIELD CONTROLLER -->
        <div class="input-bar">
            <input type="text" id="queryInput" placeholder="Type your question here..." onkeydown="if(event.key === 'Enter') executeWebSearchAI()">
            <button id="sendBtn" onclick="executeWebSearchAI()">Search & Ask</button>
        </div>
    </div>

     <script>
        async function executeWebSearchAI() {
            const inputField = document.getElementById('queryInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatWindow = document.getElementById('chatWindow');
            const rawQuery = inputField.value.trim();

            if (!rawQuery) return;

            // Lock UI elements to avoid multiple clicks
            inputField.value = '';
            inputField.disabled = true;
            sendBtn.disabled = true;

            // Append User Question to the chat window
            const userMsg = document.createElement('div');
            userMsg.className = 'msg-bubble msg-user';
            userMsg.textContent = rawQuery;
            chatWindow.appendChild(userMsg);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Create temporary AI status bubble
            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg-bubble msg-ai';
            aiMsg.innerHTML = `<div class="search-badge">🌐 Querying open database infrastructure...</div><div class="ai-text">Analyzing references...</div>`;
            chatWindow.appendChild(aiMsg);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                // Build a native CORS-allowed API string targeting the open search gateway
                const targetUrl = `https://wikipedia.org{encodeURIComponent(rawQuery)}`;
                
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Database network path timeout.");
                
                const data = await response.json();
                const searchResults = data.query?.search || [];

                let aggregatedTextContext = "";
                let citationLinks = [];

                searchResults.forEach((result) => {
                    // Extract and strip html tags safely from text snippets
                    const cleanSnippet = result.snippet ? result.snippet.replace(/<\/?[^>]+(>|$)/g, "") : "";
                    const sourceUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(result.title)}`;
                    
                    if (cleanSnippet) {
                        aggregatedTextContext += `${cleanSnippet} `;
                        citationLinks.push({ title: result.title, url: sourceUrl });
                    }
                });

                // Fallback direct parser if zero search context maps return
                if (!aggregatedTextContext.trim()) {
                    throw new Error("No readable search text matched this query topic.");
                }

                // Clean duplicate white spacing safely
                let cleanContextText = aggregatedTextContext.replace(/\s+/g, ' ').trim();
                
                // Generate instant local client-side summarized response template
                let refinedSummaryOutput = `I searched open web registers for your query. Here is a live real-time synthesis of the top matching results:\n\n${cleanContextText}`;

                // Render structured final presentation inside UI
                let finalFormattedHtml = `
                    <div class="search-badge">✅ Web Content Analyzed Successfully</div>
                    <div class="ai-text">${refinedSummaryOutput.replace(/\n/g, '<br>')}</div>
                `;

                // Print clear citations at the base
                if (citationLinks.length > 0) {
                    finalFormattedHtml += `<div style="margin-top:12px; font-size:0.8rem; border-top:1px solid rgba(255,255,255,0.05); padding-top:8px; color:var(--text-muted);"><strong>Sources verified:</strong><ul style="margin-left:15px; margin-top:4px;">`;
                    citationLinks.forEach(link => {
                        finalFormattedHtml += `<li><a href="${link.url}" target="_blank" style="color:var(--accent-glow); text-decoration:none;">${link.title}</a></li>`;
                    });
                    finalFormattedHtml += `</ul></div>`;
                }

                aiMsg.innerHTML = finalFormattedHtml;

            } catch (runtimeError) {
                console.error(runtimeError);
                aiMsg.innerHTML = `<span style="color:#ef4444;">⚠️ The web query failed to fetch data. No matching records found. Please try a different query topic phrase.</span>`;
            }

            // Restore input text box and button control access
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
